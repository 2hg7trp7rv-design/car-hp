<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">吸気系の比較</title>
  <desc id="desc">純正エアクリボックス、剥き出しフィルター、遮熱板ありの違いを比較する図解。</desc>
  <defs><style>.bg{fill:#f7f1e7}.ink{fill:#1f2929}.sub{fill:#6f6960}.teal{fill:#0abab5}.line{stroke:#1f2929;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.tline{stroke:#0abab5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gline{stroke:#555;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fffaf0;stroke:#0abab5;stroke-width:3}.box{fill:#fffdf8;stroke:#d9d1bf;stroke-width:3}.jp{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif}.sans{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#0abab5"/></marker><marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#555"/></marker></defs>
  <rect class="bg" width="1200" height="1500"/><text x="600" y="110" text-anchor="middle" class="jp ink" font-size="72" font-weight="800">吸気系の比較</text><text x="600" y="170" text-anchor="middle" class="sans sub" font-size="27" letter-spacing="3">純正・剥き出し・遮熱板ありの違い</text><path class="tline" d="M250 210h700"/><rect x="584" y="194" width="32" height="32" transform="rotate(45 600 210)" fill="none" stroke="#0abab5" stroke-width="4"/>
  <g transform="translate(45 270)"><rect class="panel" width="340" height="820" rx="14"/><rect x="0" y="0" width="340" height="70" rx="14" fill="#eefbf9"/><text x="170" y="46" text-anchor="middle" class="sans teal" font-size="34" font-weight="800">純正</text><rect x="84" y="170" width="150" height="180" rx="14" fill="none" stroke="#1f2929" stroke-width="3"/><path class="line" d="M112 210h94M112 250h94M112 290h94"/><path class="tline" d="M162 660C152 590 190 500 160 360" marker-end="url(#arrow)"/><path class="line" d="M162 660h-70v-60h70M162 360c45-30 86-36 128-22"/><text x="65" y="715" class="sans teal" font-size="26" font-weight="800">外気</text><text x="205" y="270" class="sans ink" font-size="23">エアクリ</text><text x="205" y="300" class="sans ink" font-size="23">ボックス</text><text x="210" y="530" class="sans ink" font-size="23">ダクト</text><text x="40" y="775" class="sans ink" font-size="24">外気を効率よく</text><text x="40" y="815" class="sans ink" font-size="24">取り入れる構造。</text></g>
  <g transform="translate(430 270)"><rect class="box" width="340" height="820" rx="14"/><rect x="0" y="0" width="340" height="70" rx="14" fill="#fffdf8" stroke="#1f2929" stroke-width="3"/><text x="145" y="46" text-anchor="middle" class="sans ink" font-size="32" font-weight="800">剥き出し</text><text x="250" y="48" class="sans ink" font-size="46" font-weight="800">×</text><ellipse cx="175" cy="405" rx="92" ry="260" fill="#444" opacity=".08"/><path class="gline" d="M105 300c30 30 40 70 16 110M230 290c-38 36-44 82-18 125M140 470c28 24 35 65 5 100M260 470c-42 30-52 72-24 118"/><path class="line" d="M123 372l110-45 52 126-110 45zM132 385l110-45M143 412l110-45M154 440l110-45"/><path class="gline" d="M175 255v95" marker-end="url(#arrowGray)"/><text x="155" y="230" class="sans ink" font-size="26" font-weight="800">熱</text><text x="55" y="700" class="sans ink" font-size="24">エンジン熱を</text><text x="55" y="740" class="sans teal" font-size="24" font-weight="800">吸いやすい</text><text x="55" y="790" class="sans ink" font-size="24">吸気温度が</text><text x="55" y="830" class="sans ink" font-size="24">上がりやすい。</text></g>
  <g transform="translate(815 270)"><rect class="panel" width="340" height="820" rx="14"/><rect x="0" y="0" width="340" height="70" rx="14" fill="#eefbf9"/><text x="170" y="46" text-anchor="middle" class="sans teal" font-size="30" font-weight="800">剥き出し＋遮熱板</text><path class="line" d="M112 200l78 610"/><path d="M106 200l84 610" stroke="#1f2929" stroke-width="8" fill="none"/><path class="line" d="M160 400l110-45 52 126-110 45zM170 414l110-45M181 441l110-45M192 468l110-45"/><path class="tline" d="M104 690C122 590 170 545 205 505" marker-end="url(#arrow)"/><path class="gline" d="M60 420c40 50 46 100 20 160" opacity=".55"/><text x="53" y="735" class="sans teal" font-size="26" font-weight="800">外気</text><text x="206" y="285" class="sans ink" font-size="24">遮熱板</text><text x="45" y="770" class="sans ink" font-size="24">熱の影響を</text><text x="45" y="810" class="sans teal" font-size="24" font-weight="800">減らしやすい</text></g>
  <g transform="translate(70 1140)"><rect x="0" y="0" width="1060" height="230" rx="20" fill="none" stroke="#0abab5" stroke-width="3" stroke-dasharray="7 8"/><text x="100" y="75" class="sans teal" font-size="31" font-weight="800">純正</text><text x="100" y="125" class="sans ink" font-size="25">外気を吸いやすい</text><text x="435" y="75" class="sans ink" font-size="31" font-weight="800">剥き出し</text><text x="435" y="125" class="sans ink" font-size="25">熱を吸いやすい</text><text x="760" y="75" class="sans teal" font-size="31" font-weight="800">遮熱板あり</text><text x="760" y="125" class="sans ink" font-size="25">熱の影響を減らしやすい</text><path class="tline" d="M70 175h60" marker-end="url(#arrow)"/><text x="150" y="184" class="sans sub" font-size="24">外気（冷たい空気）の流れ</text><path class="gline" d="M610 175h60" marker-end="url(#arrowGray)"/><text x="690" y="184" class="sans sub" font-size="24">熱の流れ</text></g>
</svg>