<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">純正エアボックスとオープンタイプ吸気の確認ポイント</title>
  <desc id="desc">吸気経路、センサー位置、遮熱、水対策、純正戻しを比較する図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#FFF6EF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6E5140" flood-opacity=".13"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#42A5F5"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#EF6C67"/></marker>
    <style>text{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2D2D2D}.title{font-size:52px;font-weight:700}.sub{font-size:25px;fill:#76685E}.head{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px;fill:#6B625C}.pill{font-size:20px;font-weight:700}</style>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <text x="800" y="86" text-anchor="middle" class="title">吸気系は「音」だけで選ばない</text>
  <text x="800" y="128" text-anchor="middle" class="sub">空気の入口からセンサーまで、流れ・温度・水・復元性を確認する</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="700" height="570" rx="38" fill="#FFF" stroke="#9BC9F6" stroke-width="4"/>
    <rect x="830" y="190" width="700" height="570" rx="38" fill="#FFF" stroke="#FFB7A3" stroke-width="4"/>
  </g>
  <text x="420" y="255" text-anchor="middle" class="head" fill="#2F82C9">純正エアボックス</text>
  <text x="1180" y="255" text-anchor="middle" class="head" fill="#E8685D">オープンタイプ</text>

  <g>
    <path d="M145 410h115" stroke="#42A5F5" stroke-width="18" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <text x="145" y="365" class="label" fill="#2F82C9">外気導入口</text>
    <rect x="275" y="330" width="245" height="190" rx="25" fill="#EAF5FF" stroke="#42A5F5" stroke-width="5"/>
    <path d="M315 365h165M315 395h165M315 425h165M315 455h165" stroke="#69B4F1" stroke-width="8" stroke-linecap="round"/>
    <text x="397" y="565" text-anchor="middle" class="label">エアボックス</text>
    <path d="M520 425h115" stroke="#42A5F5" stroke-width="18" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <circle cx="670" cy="425" r="42" fill="#FFF" stroke="#2F82C9" stroke-width="8"/><path d="M655 425h30M670 410v30" stroke="#2F82C9" stroke-width="7" stroke-linecap="round"/>
    <text x="670" y="495" text-anchor="middle" class="body">センサー周辺</text>
    <g transform="translate(125 625)">
      <rect width="180" height="58" rx="29" fill="#E8F5F3"/><text x="90" y="37" text-anchor="middle" class="pill" fill="#188E83">外気経路</text>
      <rect x="195" width="180" height="58" rx="29" fill="#EEF7FF"/><text x="285" y="37" text-anchor="middle" class="pill" fill="#2F82C9">水の分離</text>
      <rect x="390" width="180" height="58" rx="29" fill="#F7EEFC"/><text x="480" y="37" text-anchor="middle" class="pill" fill="#8A39A0">純正復元</text>
    </g>
  </g>

  <g>
    <path d="M900 425h105" stroke="#42A5F5" stroke-width="18" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <path d="M920 335c55-80 150-90 210-20" fill="none" stroke="#EF6C67" stroke-width="16" stroke-linecap="round" marker-end="url(#redArrow)" opacity=".85"/>
    <text x="905" y="305" class="label" fill="#E8685D">エンジンルームの熱</text>
    <path d="M1020 350l145 75-145 75z" fill="#FFF0EC" stroke="#EF6C67" stroke-width="6"/>
    <path d="M1045 385l90 40-90 40z" fill="#FFB7A3" opacity=".75"/>
    <text x="1090" y="555" text-anchor="middle" class="label">フィルター</text>
    <path d="M1165 425h105" stroke="#42A5F5" stroke-width="18" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <circle cx="1310" cy="425" r="42" fill="#FFF" stroke="#E8685D" stroke-width="8"/><path d="M1295 425h30M1310 410v30" stroke="#E8685D" stroke-width="7" stroke-linecap="round"/>
    <text x="1310" y="495" text-anchor="middle" class="body">センサー周辺</text>
    <g transform="translate(885 625)">
      <rect width="180" height="58" rx="29" fill="#FFF1EA"/><text x="90" y="37" text-anchor="middle" class="pill" fill="#D95D4E">遮熱</text>
      <rect x="195" width="180" height="58" rx="29" fill="#FFF7E5"/><text x="285" y="37" text-anchor="middle" class="pill" fill="#B47A14">水対策</text>
      <rect x="390" width="180" height="58" rx="29" fill="#E8F5F3"/><text x="480" y="37" text-anchor="middle" class="pill" fill="#188E83">配管密閉</text>
    </g>
  </g>
  <text x="800" y="824" text-anchor="middle" class="body">製品の形式よりも、車種適合・取り付け位置・装着後の状態を確認する</text>
</svg>
