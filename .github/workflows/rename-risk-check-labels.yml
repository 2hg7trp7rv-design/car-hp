name: Rename Risk Check Labels

on:
  push:
    branches:
      - "2"
    paths:
      - ".tmp/rename-risk-check-labels.trigger"

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch 2
        uses: actions/checkout@v4
        with:
          ref: "2"
          fetch-depth: 1

      - name: Replace labels
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/editorialArticle/VisualJsonArticlePage.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'RiskSection title="ここがヤバい"': 'RiskSection title="ハマりやすい罠"',
              'CheckCards title="じゃあ、こうしよう"': 'CheckCards title="押さえるべきコツ"',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary files
        run: |
          rm -f .tmp/rename-risk-check-labels.trigger
          rm -f .github/workflows/rename-risk-check-labels.yml
          rmdir .tmp 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/editorialArticle/VisualJsonArticlePage.tsx \
                  .tmp/rename-risk-check-labels.trigger \
                  .github/workflows/rename-risk-check-labels.yml
          git commit -m "Rename risk and check section headings"
          git push origin HEAD:2
