<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">純正・ダウンサス・車高調の違い</title><desc id="desc">3つの選択肢を目的、変化、確認点で比較した図</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#F2FAF9"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#315C59" flood-opacity=".12"/></filter><style>text{font-family:"Zen Maru Gothic","Hiragino Sans","Yu Gothic",sans-serif;fill:#202726}.h{font-size:44px;font-weight:700}.sub{font-size:22px;fill:#52605E}.tag{font-size:17px;font-weight:700}.card{font-size:31px;font-weight:700}.body{font-size:20px;fill:#52605E}.label{font-size:18px;font-weight:700;fill:#005E5B}.note{font-size:19px;fill:#52605E}</style></defs>
  <rect width="1280" height="720" rx="42" fill="url(#bg)"/><text x="640" y="70" text-anchor="middle" class="h">正解は一つではない。変えたいものから選ぶ</text><text x="640" y="108" text-anchor="middle" class="sub">低さ・調整幅・費用・日常の使いやすさを、自分の優先順位で並べる</text>
  <g transform="translate(70 150)" filter="url(#s)"><rect width="350" height="470" rx="30" fill="#fff" stroke="#78908C" stroke-width="3"/><rect x="24" y="24" width="92" height="32" rx="16" fill="#E9EFEE"/><text x="70" y="46" text-anchor="middle" class="tag" fill="#3F5D59">基準</text><text x="28" y="108" class="card">純正のまま</text><text x="28" y="156" class="label">向いている目的</text><text x="28" y="188" class="body">メーカー設計のバランスと</text><text x="28" y="218" class="body">日常の使いやすさを残したい</text><text x="28" y="270" class="label">主な変化</text><text x="28" y="302" class="body">追加費用や高さの変化なし</text><text x="28" y="354" class="label">確認したいこと</text><text x="28" y="386" class="body">ショックやブッシュなど、</text><text x="28" y="416" class="body">純正部品の劣化を先に点検</text></g>
  <g transform="translate(465 150)" filter="url(#s)"><rect width="350" height="470" rx="30" fill="#fff" stroke="#C49422" stroke-width="3"/><rect x="24" y="24" width="112" height="32" rx="16" fill="#FFF3D3"/><text x="80" y="46" text-anchor="middle" class="tag" fill="#7D5900">変化は限定的</text><text x="28" y="108" class="card">ダウンサス</text><text x="28" y="156" class="label">向いている目的</text><text x="28" y="188" class="body">高さを穏やかに変えたい</text><text x="28" y="218" class="body">調整機構は必要ない</text><text x="28" y="270" class="label">主な変化</text><text x="28" y="302" class="body">スプリングを交換するため、</text><text x="28" y="332" class="body">純正ダンパーとの相性を見る</text><text x="28" y="384" class="label">確認したいこと</text><text x="28" y="416" class="body">適合、下がり幅、ストローク、</text><text x="28" y="446" class="body">バンプラバー、アライメント</text></g>
  <g transform="translate(860 150)" filter="url(#s)"><rect width="350" height="470" rx="30" fill="#fff" stroke="#0ABAB5" stroke-width="4"/><rect x="24" y="24" width="112" height="32" rx="16" fill="#DDF5F3"/><text x="80" y="46" text-anchor="middle" class="tag" fill="#005E5B">調整幅が広い</text><text x="28" y="108" class="card">車高調</text><text x="28" y="156" class="label">向いている目的</text><text x="28" y="188" class="body">高さや乗り味を製品範囲で</text><text x="28" y="218" class="body">調整しながら決めたい</text><text x="28" y="270" class="label">主な変化</text><text x="28" y="302" class="body">スプリングとダンパーを</text><text x="28" y="332" class="body">セットで交換する</text><text x="28" y="384" class="label">確認したいこと</text><text x="28" y="416" class="body">構造、推奨範囲、減衰、干渉、</text><text x="28" y="446" class="body">アライメント、点検方法</text></g>
  <text x="640" y="670" text-anchor="middle" class="note">※実際の変化は、車種・製品・タイヤ・設定・取り付け状態で変わります。</text>
</svg>
