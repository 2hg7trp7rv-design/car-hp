<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">社外エアクリーナーで見る場所</title>
  <desc id="desc">吸気口、フィルター、MAFセンサー、ECU、エンジンの流れと確認点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff6e9"/><stop offset="1" stop-color="#fffef8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#8b4b18" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto"><path d="M2 2 L10 10 L2 10 Z" fill="#5f7cdb"/></marker>
  </defs>
  <rect width="720" height="1080" rx="44" fill="url(#bg)"/>
  <text x="54" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="34" font-weight="900" fill="#242424">空気の通り道で見る</text>
  <text x="54" y="120" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20" font-weight="700" fill="#6d5b4d">外気 → フィルター → センサー → ECU</text>
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="90" y="174" width="540" height="92" rx="30" fill="#fff" stroke="#42a5f5" stroke-width="4"/><text x="360" y="230" text-anchor="middle" font-size="25" font-weight="900" fill="#164577">外気の入口</text>
    <path d="M360 276 V326" stroke="#5f7cdb" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="90" y="338" width="540" height="118" rx="30" fill="#fff" stroke="#ff8c42" stroke-width="4"/><text x="360" y="391" text-anchor="middle" font-size="25" font-weight="900" fill="#7b3d09">フィルター</text><text x="360" y="423" text-anchor="middle" font-size="18" font-weight="700" fill="#6d5b4d">音・見た目・ろ過</text>
    <path d="M360 466 V516" stroke="#5f7cdb" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="90" y="528" width="540" height="118" rx="30" fill="#fff" stroke="#26a69a" stroke-width="4"/><text x="360" y="581" text-anchor="middle" font-size="25" font-weight="900" fill="#0c5c53">MAFセンサー</text><text x="360" y="613" text-anchor="middle" font-size="18" font-weight="700" fill="#55716e">空気量・吸気温度を読む</text>
    <path d="M360 656 V706" stroke="#5f7cdb" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="90" y="718" width="540" height="92" rx="30" fill="#fff" stroke="#ab47bc" stroke-width="4"/><text x="360" y="774" text-anchor="middle" font-size="25" font-weight="900" fill="#6c257d">ECUが燃料を計算</text>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="70" y="860" width="180" height="112" rx="25" fill="#fff5f8" stroke="#f06292" stroke-width="3"/><text x="160" y="909" text-anchor="middle" font-size="25" font-weight="900" fill="#c73570">熱</text><text x="160" y="942" text-anchor="middle" font-size="16" font-weight="700" fill="#5d4b56">遮熱と位置</text>
    <rect x="270" y="860" width="180" height="112" rx="25" fill="#f1fbff" stroke="#42a5f5" stroke-width="3"/><text x="360" y="909" text-anchor="middle" font-size="25" font-weight="900" fill="#1d78b7">水</text><text x="360" y="942" text-anchor="middle" font-size="16" font-weight="700" fill="#4e6270">雨水の経路</text>
    <rect x="470" y="860" width="180" height="112" rx="25" fill="#f3fff9" stroke="#26a69a" stroke-width="3"/><text x="560" y="909" text-anchor="middle" font-size="25" font-weight="900" fill="#168474">接合</text><text x="560" y="942" text-anchor="middle" font-size="16" font-weight="700" fill="#4e665f">隙間と固定</text>
  </g>
</svg>
