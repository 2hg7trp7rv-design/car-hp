<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1530" viewBox="0 0 720 1530" role="img" aria-labelledby="title desc"><title id="title">後悔しにくいカスタムの5ステップ</title><desc id="desc">目的、適合、純正保管、施工後確認、記録を縦に並べたスマホ用図解</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#fff8f0"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8a6f5d" flood-opacity=".12"/></filter><style>text{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2d2d2d}.t{font-size:40px;font-weight:700}.s{font-size:23px;fill:#76685e}.h{font-size:30px;font-weight:700}.p{font-size:23px;fill:#675e58}.num{font-size:26px;font-weight:700;fill:#fff}.tag{font-size:20px;font-weight:700}</style></defs><rect width="720" height="1530" rx="40" fill="url(#bg)"/><text x="360" y="70" text-anchor="middle" class="t">後悔しにくいカスタムの5ステップ</text><text x="360" y="108" text-anchor="middle" class="s">パーツ探しより先に、目的と戻し方を決める</text>
<path d="M108 224v1050" stroke="#e6d8ca" stroke-width="8" stroke-dasharray="14 14"/>
<g transform="translate(56 160)" filter="url(#sh)"><rect x="70" width="538" height="210" rx="30" fill="#fff" stroke="#ff8c42" stroke-width="3"/><circle cx="52" cy="80" r="46" fill="#ff8c42"/><text x="52" y="90" text-anchor="middle" class="num">1</text><text x="110" y="52" class="tag" fill="#e8732f">STEP 1</text><text x="110" y="96" class="h">目的を決める</text><text x="110" y="139" class="p">何を変えたいか</text><text x="110" y="176" class="p">不満を言葉にする</text></g>
<g transform="translate(56 420)" filter="url(#sh)"><rect x="70" width="538" height="210" rx="30" fill="#fff" stroke="#8bc34a" stroke-width="3"/><circle cx="52" cy="80" r="46" fill="#8bc34a"/><text x="52" y="90" text-anchor="middle" class="num">2</text><text x="110" y="52" class="tag" fill="#6e9f31">STEP 2</text><text x="110" y="96" class="h">適合を確認</text><text x="110" y="139" class="p">型式・年式・装備</text><text x="110" y="176" class="p">影響範囲も見る</text></g>
<g transform="translate(56 680)" filter="url(#sh)"><rect x="70" width="538" height="210" rx="30" fill="#fff" stroke="#42a5f5" stroke-width="3"/><circle cx="52" cy="80" r="46" fill="#42a5f5"/><text x="52" y="90" text-anchor="middle" class="num">3</text><text x="110" y="52" class="tag" fill="#367dbb">STEP 3</text><text x="110" y="96" class="h">純正を保管</text><text x="110" y="139" class="p">部品・書類・写真</text><text x="110" y="176" class="p">戻せる状態を残す</text></g>
<g transform="translate(56 940)" filter="url(#sh)"><rect x="70" width="538" height="210" rx="30" fill="#fff" stroke="#ab47bc" stroke-width="3"/><circle cx="52" cy="80" r="46" fill="#ab47bc"/><text x="52" y="90" text-anchor="middle" class="num">4</text><text x="110" y="52" class="tag" fill="#8f4fa8">STEP 4</text><text x="110" y="96" class="h">施工後に確認</text><text x="110" y="139" class="p">警告・異音・干渉</text><text x="110" y="176" class="p">試乗して確かめる</text></g>
<g transform="translate(56 1200)" filter="url(#sh)"><rect x="70" width="538" height="210" rx="30" fill="#fff" stroke="#607d8b" stroke-width="3"/><circle cx="52" cy="80" r="46" fill="#607d8b"/><text x="52" y="90" text-anchor="middle" class="num">5</text><text x="110" y="52" class="tag" fill="#455a64">STEP 5</text><text x="110" y="96" class="h">記録する</text><text x="110" y="139" class="p">部品型番・施工日</text><text x="110" y="176" class="p">再点検結果を残す</text></g>
<rect x="102" y="1450" width="516" height="58" rx="29" fill="#ff8c42"/><text x="360" y="1488" text-anchor="middle" class="num">確認できる状態がゴール</text></svg>