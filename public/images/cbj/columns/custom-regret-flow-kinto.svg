<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="車カスタムで失敗しないための進め方"><rect width="1600" height="1000" fill="#f7fbfb"/><text x="120" y="126" font-family="Noto Sans JP, sans-serif" font-size="58" font-weight="900" fill="#111">失敗しにくい進め方</text><text x="120" y="192" font-family="Noto Sans JP, sans-serif" font-size="30" fill="#666">START FROM STOCK CONDITION</text><g transform="translate(120 360)" font-family="Noto Sans JP, sans-serif" font-weight="900"><g><circle cx="60" cy="60" r="60" fill="#81d8d0"/><text x="60" y="76" text-anchor="middle" font-size="44" fill="#fff">1</text><text x="150" y="72" font-size="36" fill="#111">純正の不満を言葉にする</text></g><g transform="translate(0 125)"><circle cx="60" cy="60" r="60" fill="#81d8d0"/><text x="60" y="76" text-anchor="middle" font-size="44" fill="#fff">2</text><text x="150" y="72" font-size="36" fill="#111">純正状態を点検する</text></g><g transform="translate(0 250)"><circle cx="60" cy="60" r="60" fill="#81d8d0"/><text x="60" y="76" text-anchor="middle" font-size="44" fill="#fff">3</text><text x="150" y="72" font-size="36" fill="#111">戻せる部品から試す</text></g><g transform="translate(0 375)"><circle cx="60" cy="60" r="60" fill="#81d8d0"/><text x="60" y="76" text-anchor="middle" font-size="44" fill="#fff">4</text><text x="150" y="72" font-size="36" fill="#111">取り付け後に確認する</text></g><g transform="translate(0 500)"><circle cx="60" cy="60" r="60" fill="#81d8d0"/><text x="60" y="76" text-anchor="middle" font-size="44" fill="#fff">5</text><text x="150" y="72" font-size="36" fill="#111">記録と書類を残す</text></g></g><path d="M180 480v500" stroke="#81d8d0" stroke-width="8" stroke-linecap="round" opacity=".4"/></svg>