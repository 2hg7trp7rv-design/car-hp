<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">エアクリの位置</title>
  <desc id="desc">外気がエアクリを通ってエンジンへ向かう流れを示す図解。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0A5E5B" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="11" orient="auto"><path d="M2 2 L12 12 L2 12 Z" fill="#0ABAB5"/></marker>
  </defs>
  <rect width="720" height="1080" rx="44" fill="#FFFFFF"/>
  <rect x="34" y="34" width="652" height="1012" rx="38" fill="#F5FFFE" stroke="#BEECE9" stroke-width="3"/>
  <text x="72" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="35" font-weight="850" fill="#111827">エアクリは、</text>
  <text x="72" y="144" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="35" font-weight="850" fill="#111827">空気の入口</text>
  <text x="74" y="190" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="18" font-weight="650" fill="#475569">エンジンに入る空気を通す場所</text>
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="110" y="260" width="500" height="104" rx="30" fill="#FFFFFF" stroke="#0ABAB5" stroke-width="5"/>
    <text x="360" y="322" text-anchor="middle" font-size="28" font-weight="850" fill="#111827">外気</text>
    <path d="M360 383 V443" stroke="#0ABAB5" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="110" y="470" width="500" height="132" rx="30" fill="#FFFFFF" stroke="#0ABAB5" stroke-width="5"/>
    <text x="360" y="529" text-anchor="middle" font-size="28" font-weight="850" fill="#111827">エアクリ</text>
    <text x="360" y="564" text-anchor="middle" font-size="17" font-weight="650" fill="#64748B">空気をきれいにして通す</text>
    <path d="M360 623 V683" stroke="#0ABAB5" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="110" y="710" width="500" height="104" rx="30" fill="#FFFFFF" stroke="#0ABAB5" stroke-width="5"/>
    <text x="360" y="772" text-anchor="middle" font-size="28" font-weight="850" fill="#111827">エンジン</text>
  </g>
  <rect x="76" y="890" width="568" height="104" rx="26" fill="#FFFFFF" stroke="#BEECE9" stroke-width="3"/>
  <text x="112" y="934" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20" font-weight="800" fill="#0A6F6C">形が変わると、</text>
  <text x="112" y="966" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20" font-weight="800" fill="#0A6F6C">音・熱・水・センサーの話につながる</text>
</svg>
