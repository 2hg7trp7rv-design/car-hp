<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">車のカスタムの影響と注意点</title><desc id="desc">カスタムが吸気、ADAS、電装、足回り、車検保証、売却リセールに影響することを示す総合図解。</desc>
  <defs><style>.bg{fill:#f7f1e7}.ink{fill:#1f2929}.sub{fill:#6f6960}.teal{fill:#0abab5}.line{stroke:#1f2929;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.tline{stroke:#0abab5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:8 8}.box{fill:#fffdf8;stroke:#0abab5;stroke-width:3}.jp{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif}.sans{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#0abab5"/></marker></defs>
  <rect class="bg" width="1200" height="1500"/><path class="tline" d="M70 70h180M950 70h180"/><rect x="584" y="162" width="32" height="32" transform="rotate(45 600 178)" fill="none" stroke="#0abab5" stroke-width="4"/><text x="600" y="130" text-anchor="middle" class="jp ink" font-size="74" font-weight="800">車のカスタムの</text><text x="600" y="215" text-anchor="middle" class="jp ink" font-size="74" font-weight="800">影響と注意点</text><text x="600" y="285" text-anchor="middle" class="sans sub" font-size="28" letter-spacing="3">純正を崩す前に、全体で考える</text><path class="tline" d="M330 250h540"/>
  <g transform="translate(330 535)"><path class="line" d="M20 165h385l40-36h95l40 36h70v22H20z"/><circle class="line" cx="130" cy="190" r="42"/><circle class="line" cx="535" cy="190" r="42"/><path class="line" d="M55 165c35-95 135-145 290-145h190c88 0 135 48 172 145"/><path class="tline" d="M220 230c100 35 250 35 385 0" opacity=".45"/></g>
  <g transform="translate(78 335)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="30" font-weight="800">吸気系</text><path class="line" d="M85 82l84-34 40 70-84 34zM92 95l84-34M103 120l84-34"/><text x="142" y="158" text-anchor="middle" class="sans ink" font-size="22">吸気効率の変化が</text><text x="142" y="188" text-anchor="middle" class="sans ink" font-size="22">他系統に影響</text></g>
  <g transform="translate(455 335)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="30" font-weight="800">ADAS / カメラ</text><rect x="124" y="70" width="36" height="18" rx="5" fill="none" stroke="#1f2929" stroke-width="3"/><path class="tline" d="M142 88l-70 80M142 88l70 80"/><path class="line dash" d="M72 122h140"/><text x="142" y="150" text-anchor="middle" class="sans ink" font-size="21">カメラ角度のずれで</text><text x="142" y="180" text-anchor="middle" class="sans ink" font-size="21">検知性能が低下</text></g>
  <g transform="translate(832 335)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="30" font-weight="800">ECU / 電装</text><rect x="92" y="74" width="105" height="70" rx="8" fill="none" stroke="#1f2929" stroke-width="3"/><path class="line" d="M112 95h65M112 118h65M112 138h65"/><text x="142" y="169" text-anchor="middle" class="sans ink" font-size="21">通信や負荷に</text><text x="142" y="198" text-anchor="middle" class="sans ink" font-size="21">影響する可能性</text></g>
  <g transform="translate(80 850)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="30" font-weight="800">サスペンション</text><path class="line" d="M96 78v80M78 98c35-28 62-28 96 0M78 125c35-28 62-28 96 0M78 152c35-28 62-28 96 0M96 160h80l50 30"/><text x="142" y="182" text-anchor="middle" class="sans ink" font-size="21">車高やストロークが</text><text x="142" y="211" text-anchor="middle" class="sans ink" font-size="21">安全性に影響</text></g>
  <g transform="translate(455 925)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="28" font-weight="800">車検・保証</text><rect x="105" y="72" width="70" height="90" rx="8" fill="none" stroke="#1f2929" stroke-width="3"/><path class="tline" d="M122 110l16 16 33-42"/><text x="142" y="182" text-anchor="middle" class="sans ink" font-size="21">基準に合わないと</text><text x="142" y="211" text-anchor="middle" class="sans ink" font-size="21">負担になる</text></g>
  <g transform="translate(832 850)"><rect class="box" width="285" height="190" rx="16"/><text x="142" y="48" text-anchor="middle" class="sans teal" font-size="28" font-weight="800">売却・リセール</text><path class="line" d="M82 128h118l20 30h-160zM100 118h82M110 105h62"/><circle cx="220" cy="105" r="32" fill="none" stroke="#0abab5" stroke-width="5"/><text x="220" y="117" text-anchor="middle" class="sans teal" font-size="44" font-weight="800">¥</text><text x="142" y="178" text-anchor="middle" class="sans ink" font-size="21">好みが分かれると</text><text x="142" y="207" text-anchor="middle" class="sans ink" font-size="21">査定に影響</text></g>
  <g class="tline dash"><path d="M360 520l135 120"/><path d="M600 525v100"/><path d="M840 525L730 650"/><path d="M365 910l175-145"/><path d="M600 930v-135"/><path d="M832 910l-125-135"/></g><g fill="#0abab5"><circle cx="500" cy="640" r="12"/><circle cx="600" cy="630" r="12"/><circle cx="728" cy="650" r="12"/><circle cx="540" cy="765" r="12"/><circle cx="600" cy="795" r="12"/><circle cx="707" cy="775" r="12"/></g>
  <g transform="translate(70 1225)"><rect class="box" width="1060" height="180" rx="18"/><path d="M70 45l52 95H18z" fill="#0abab5" opacity=".95"/><text x="70" y="125" text-anchor="middle" fill="#fff" font-size="72" font-family="sans-serif" font-weight="800">!</text><text x="165" y="70" class="sans ink" font-size="28" font-weight="800">カスタムは「見た目や性能」だけでなく、</text><text x="165" y="110" class="sans teal" font-size="28" font-weight="800">クルマ全体のバランスと将来への影響</text><text x="165" y="150" class="sans ink" font-size="24">を考えることが大切です。</text><text x="610" y="78" class="sans ink" font-size="22">● 保安基準を守る</text><text x="610" y="116" class="sans ink" font-size="22">● 各システムへの影響を確認</text><text x="610" y="154" class="sans ink" font-size="22">● 記録を残し、純正戻しを想定</text></g>
</svg>