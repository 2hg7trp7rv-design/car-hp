<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1460" viewBox="0 0 720 1460" role="img" aria-labelledby="title desc"><title id="title">車高を変えると見る場所が増える</title><desc id="desc">車高変更後に確認する4項目を縦に整理したスマホ用図解</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f8fff4"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#58644c" flood-opacity=".12"/></filter><style>text{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2d2d2d}.t{font-size:40px;font-weight:700}.s{font-size:23px;fill:#6e746a}.h{font-size:30px;font-weight:700}.p{font-size:23px;fill:#62695e}.num{font-size:22px;font-weight:700;fill:#fff}</style></defs><rect width="720" height="1460" rx="40" fill="url(#bg)"/><text x="360" y="70" text-anchor="middle" class="t">車高を変えると、見る場所が増える</text><text x="360" y="108" text-anchor="middle" class="s">低さだけでなく、動き・接地・直進性・運転支援へ</text>
<g transform="translate(58 150)" filter="url(#sh)"><rect width="604" height="260" rx="34" fill="#fff" stroke="#8bc34a" stroke-width="3"/><text x="302" y="58" text-anchor="middle" class="h">車高変更</text><path d="M150 162h304c18 0 33 10 39 25l18 45H93l18-45c6-15 21-25 39-25z" fill="#eaf6da" stroke="#6e9f31" stroke-width="7"/><circle cx="170" cy="232" r="36" fill="#333"/><circle cx="434" cy="232" r="36" fill="#333"/><path d="M180 102v48M424 102v48" stroke="#8bc34a" stroke-width="8" stroke-linecap="round"/><path d="M164 134l16 18 16-18M408 134l16 18 16-18" stroke="#8bc34a" stroke-width="7" fill="none"/></g>
<path d="M360 426v32" stroke="#9ab27a" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(58 470)" filter="url(#sh)"><rect width="604" height="180" rx="30" fill="#fff" stroke="#ffca28" stroke-width="3"/><circle cx="74" cy="72" r="34" fill="#ffca28"/><text x="74" y="80" text-anchor="middle" class="num">01</text><text x="130" y="61" class="h">ストローク</text><text x="130" y="106" class="p">底付き・跳ね・乗り心地</text><text x="130" y="143" class="p">段差での動ける量を確認</text></g>
<path d="M360 662v24" stroke="#9ab27a" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(58 698)" filter="url(#sh)"><rect width="604" height="180" rx="30" fill="#fff" stroke="#42a5f5" stroke-width="3"/><circle cx="74" cy="72" r="34" fill="#42a5f5"/><text x="74" y="80" text-anchor="middle" class="num">02</text><text x="130" y="61" class="h">アライメント</text><text x="130" y="106" class="p">直進性・偏摩耗・操舵感</text><text x="130" y="143" class="p">装着後に測定して調整</text></g>
<path d="M360 890v24" stroke="#9ab27a" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(58 926)" filter="url(#sh)"><rect width="604" height="180" rx="30" fill="#fff" stroke="#ff8c42" stroke-width="3"/><circle cx="74" cy="72" r="34" fill="#ff8c42"/><text x="74" y="80" text-anchor="middle" class="num">03</text><text x="130" y="61" class="h">タイヤ接地</text><text x="130" y="106" class="p">干渉・グリップ・摩耗</text><text x="130" y="143" class="p">内外の減り方まで確認</text></g>
<path d="M360 1118v24" stroke="#9ab27a" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(58 1154)" filter="url(#sh)"><rect width="604" height="180" rx="30" fill="#fff" stroke="#ab47bc" stroke-width="3"/><circle cx="74" cy="72" r="34" fill="#ab47bc"/><text x="74" y="80" text-anchor="middle" class="num">04</text><text x="130" y="61" class="h">ADAS確認</text><text x="130" y="106" class="p">必要性は車種・変更内容で判断</text><text x="130" y="143" class="p">整備情報と診断結果を確認</text></g>
<rect x="104" y="1370" width="512" height="66" rx="33" fill="#8bc34a"/><text x="360" y="1413" text-anchor="middle" class="num">装着後に測る・試す・記録する</text></svg>