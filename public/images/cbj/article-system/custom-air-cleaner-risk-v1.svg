<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">エアクリを空気の入口で見る</title>
  <desc id="desc">外気からフィルター、MAFセンサー、ECU、エンジンまでの流れと熱・水・接合部の確認点を示す図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6e9"/>
      <stop offset="1" stop-color="#fffef8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#48c6ef"/>
      <stop offset="1" stop-color="#6f86d6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#8b4b18" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#5f7cdb"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="48" fill="url(#bg)"/>
  <g opacity="0.33" fill="#ffd9aa">
    <circle cx="94" cy="94" r="18"/><circle cx="1190" cy="124" r="24"/><circle cx="1120" cy="548" r="16"/><circle cx="210" cy="550" r="28"/>
  </g>
  <text x="78" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="36" font-weight="800" fill="#242424">エアクリは「音」だけでなく、空気の入口で見る</text>
  <text x="80" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20" font-weight="600" fill="#6d5b4d">外気 → フィルター → MAFセンサー → ECU → エンジン の流れで考える</text>

  <g filter="url(#shadow)">
    <rect x="76" y="214" width="180" height="118" rx="30" fill="#ffffff" stroke="#42a5f5" stroke-width="4"/>
    <text x="166" y="262" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="23" font-weight="800" fill="#164577">外気の入口</text>
    <text x="166" y="298" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#5d6a75">水・熱の入り方</text>

    <rect x="332" y="196" width="196" height="154" rx="34" fill="#fff" stroke="#ff8c42" stroke-width="4"/>
    <circle cx="430" cy="273" r="48" fill="#fff2e5" stroke="#ff8c42" stroke-width="7"/>
    <circle cx="430" cy="273" r="25" fill="#ffffff" stroke="#ffbb7a" stroke-width="5"/>
    <text x="430" y="376" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="21" font-weight="800" fill="#7b3d09">フィルター</text>

    <rect x="610" y="214" width="190" height="118" rx="30" fill="#ffffff" stroke="#26a69a" stroke-width="4"/>
    <text x="705" y="262" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="23" font-weight="800" fill="#0c5c53">MAFセンサー</text>
    <text x="705" y="298" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#55716e">空気量を読む</text>

    <rect x="874" y="206" width="152" height="134" rx="28" fill="#ffffff" stroke="#ab47bc" stroke-width="4"/>
    <text x="950" y="265" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="26" font-weight="900" fill="#6c257d">ECU</text>
    <text x="950" y="301" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#775581">燃料を計算</text>

    <rect x="1090" y="214" width="136" height="118" rx="30" fill="#ffffff" stroke="#ef5350" stroke-width="4"/>
    <text x="1158" y="265" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="23" font-weight="800" fill="#8e2d2b">エンジン</text>
    <text x="1158" y="301" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#7b5d5b">燃やして走る</text>
  </g>

  <path d="M260 274 H322" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M532 274 H600" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M806 274 H862" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1032 274 H1078" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="88" y="446" width="332" height="98" rx="26" fill="#fff5f8" stroke="#f06292" stroke-width="3"/>
    <text x="118" y="484" font-size="22" font-weight="900" fill="#c73570">熱</text>
    <text x="164" y="484" font-size="18" font-weight="700" fill="#4f4048">熱い空気を吸いやすい位置か</text>
    <text x="118" y="518" font-size="16" font-weight="600" fill="#70626a">遮熱・外気導入・停車中の変化を見る</text>

    <rect x="474" y="446" width="332" height="98" rx="26" fill="#f1fbff" stroke="#42a5f5" stroke-width="3"/>
    <text x="504" y="484" font-size="22" font-weight="900" fill="#1d78b7">水</text>
    <text x="550" y="484" font-size="18" font-weight="700" fill="#3e5362">雨水・洗車水の通り道か</text>
    <text x="504" y="518" font-size="16" font-weight="600" fill="#5d6d76">低い位置やむき出し配置は特に確認する</text>

    <rect x="860" y="446" width="332" height="98" rx="26" fill="#f3fff9" stroke="#26a69a" stroke-width="3"/>
    <text x="890" y="484" font-size="22" font-weight="900" fill="#168474">接合部</text>
    <text x="972" y="484" font-size="18" font-weight="700" fill="#3b584e">ホース・クランプ・隙間</text>
    <text x="890" y="518" font-size="16" font-weight="600" fill="#5b716a">吸気漏れや干渉を残さない</text>
  </g>
</svg>
