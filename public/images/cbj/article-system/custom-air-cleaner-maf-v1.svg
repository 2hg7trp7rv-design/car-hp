<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MAFセンサーは空気の受付係</title>
  <desc id="desc">空気が入ってMAFセンサーが量を読み、ECUが燃料量を考えてエンジンへ送る流れを示す図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1fbff"/><stop offset="1" stop-color="#fff9ef"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#345d73" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="#26a69a"/></marker>
  </defs>
  <rect width="1280" height="640" rx="50" fill="url(#bg)"/>
  <circle cx="112" cy="108" r="20" fill="#ffc1d7" opacity=".7"/><circle cx="1180" cy="132" r="24" fill="#ffdaad" opacity=".85"/><circle cx="1090" cy="548" r="18" fill="#bce7ff" opacity=".75"/>
  <text x="76" y="86" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="38" font-weight="900" fill="#252525">MAFセンサーは「空気の受付係」</text>
  <text x="78" y="132" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="21" font-weight="700" fill="#586a6d">空気をたくさん吸えることと、車が正しく読めることは別</text>
  <g filter="url(#shadow)" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif">
    <rect x="80" y="224" width="196" height="150" rx="34" fill="#fff" stroke="#42a5f5" stroke-width="4"/>
    <text x="178" y="286" text-anchor="middle" font-size="26" font-weight="900" fill="#1e6fa8">空気が入る</text>
    <text x="178" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#60727c">外気から吸気へ</text>

    <rect x="372" y="196" width="238" height="206" rx="38" fill="#fff" stroke="#26a69a" stroke-width="5"/>
    <circle cx="491" cy="264" r="42" fill="#e7fff8" stroke="#26a69a" stroke-width="6"/>
    <text x="491" y="278" text-anchor="middle" font-size="31" font-weight="900" fill="#168474">受付</text>
    <text x="491" y="336" text-anchor="middle" font-size="27" font-weight="900" fill="#222">MAFセンサー</text>
    <text x="491" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#60726c">空気量・温度を読む</text>

    <rect x="708" y="224" width="206" height="150" rx="34" fill="#fff" stroke="#ab47bc" stroke-width="4"/>
    <text x="811" y="286" text-anchor="middle" font-size="30" font-weight="900" fill="#6c257d">ECU</text>
    <text x="811" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#745d78">燃料量を考える</text>

    <rect x="1010" y="224" width="190" height="150" rx="34" fill="#fff" stroke="#ff8c42" stroke-width="4"/>
    <text x="1105" y="286" text-anchor="middle" font-size="28" font-weight="900" fill="#b75d17">エンジン</text>
    <text x="1105" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#765e4d">燃やして走る</text>
  </g>
  <path d="M286 300 H360" stroke="#26a69a" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M620 300 H696" stroke="#26a69a" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M924 300 H998" stroke="#26a69a" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif">
    <rect x="120" y="468" width="1040" height="96" rx="30" fill="#fff" stroke="#ffd2a7" stroke-width="3"/>
    <text x="160" y="510" font-size="22" font-weight="900" fill="#ff8c42">たとえ話</text>
    <text x="270" y="510" font-size="20" font-weight="800" fill="#2f2f2f">レストランの受付係が人数を数えるから、厨房は料理の量を考えられる。</text>
    <text x="270" y="545" font-size="18" font-weight="700" fill="#6d625b">車も同じ。空気を読めるから、燃料をどれくらい混ぜるか考えられる。</text>
  </g>
</svg>
