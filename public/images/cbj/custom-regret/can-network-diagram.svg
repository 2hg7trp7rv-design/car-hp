<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">CAN通信ネットワーク図</title><desc id="desc">ECU同士がCAN通信でつながり、後付け機器がOBD2から割り込むリスクを示す図解。</desc>
  <defs><style>.bg{fill:#f7f1e7}.ink{fill:#1f2929}.sub{fill:#6f6960}.teal{fill:#0abab5}.line{stroke:#1f2929;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.tline{stroke:#0abab5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 10}.box{fill:#fffaf0;stroke:#0abab5;stroke-width:3}.card{fill:#fffdf8;stroke:#1f2929;stroke-width:3}.bad{fill:#3d3d3d}.jp{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif}.sans{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#0abab5"/></marker><marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#333"/></marker></defs>
  <rect class="bg" width="1200" height="1500"/><text x="600" y="110" text-anchor="middle" class="jp ink" font-size="68" font-weight="800">CAN通信ネットワーク図</text><text x="600" y="168" text-anchor="middle" class="sans teal" font-size="27" font-weight="800" letter-spacing="2">車内のECU同士がつながるCAN通信ネットワーク</text><path class="tline" d="M245 205h710"/><rect x="584" y="189" width="32" height="32" transform="rotate(45 600 205)" fill="none" stroke="#0abab5" stroke-width="4"/>
  <g transform="translate(55 250)"><rect class="box" width="330" height="120" rx="14"/><text x="80" y="52" class="sans teal" font-size="27" font-weight="800">車内ネットワーク</text><text x="80" y="90" class="sans ink" font-size="22">各ECUがCAN通信で接続</text><rect x="42" y="42" width="25" height="25" transform="rotate(45 54 54)" fill="none" stroke="#0abab5" stroke-width="4"/></g>
  <g transform="translate(435 250)"><rect class="box" width="330" height="120" rx="14"/><text x="68" y="52" class="sans teal" font-size="25" font-weight="800">後付け機器が割り込む</text><text x="68" y="90" class="sans ink" font-size="22">負荷や遅延を発生</text><rect x="35" y="42" width="25" height="25" transform="rotate(45 47 54)" fill="none" stroke="#0abab5" stroke-width="4"/></g>
  <g transform="translate(815 250)"><rect class="box" width="330" height="120" rx="14"/><text x="72" y="52" class="sans teal" font-size="25" font-weight="800">警告灯・通信エラー</text><text x="72" y="90" class="sans ink" font-size="22">不具合の原因になる</text><rect x="38" y="42" width="25" height="25" transform="rotate(45 50 54)" fill="none" stroke="#0abab5" stroke-width="4"/></g>
  <ellipse cx="600" cy="720" rx="330" ry="150" fill="#eefbf9" stroke="#0abab5" stroke-width="6"/><ellipse cx="600" cy="720" rx="290" ry="118" fill="none" stroke="#0abab5" stroke-width="4" stroke-dasharray="12 12"/><text x="600" y="708" text-anchor="middle" class="sans teal" font-size="58" font-weight="800">CAN通信</text><text x="600" y="762" text-anchor="middle" class="sans ink" font-size="24">車内のECU同士が情報をやり取り</text>
  <g class="card sans ink" font-size="24" font-weight="800"><rect x="448" y="395" width="180" height="110" rx="10"/><text x="538" y="445" text-anchor="middle">エンジンECU</text><rect x="82" y="510" width="180" height="110" rx="10"/><text x="172" y="560" text-anchor="middle">ブレーキECU</text><rect x="936" y="515" width="180" height="110" rx="10"/><text x="1026" y="565" text-anchor="middle">エアコンECU</text><rect x="95" y="820" width="180" height="110" rx="10"/><text x="185" y="870" text-anchor="middle">ADAS ECU</text><rect x="925" y="820" width="180" height="110" rx="10"/><text x="1015" y="870" text-anchor="middle">ナビECU</text><rect x="930" y="645" width="180" height="110" rx="10"/><text x="1020" y="695" text-anchor="middle">ボディECU</text></g>
  <g class="tline"><path d="M538 505v90"/><path d="M262 620l120 55"/><path d="M936 625l-130 55"/><path d="M275 850l120-72"/><path d="M925 850l-120-75"/><path d="M930 700l-120 15"/></g>
  <g transform="translate(510 920)"><rect class="box" width="180" height="120" rx="12"/><text x="90" y="45" text-anchor="middle" class="sans ink" font-size="24" font-weight="800">OBD2ポート</text><rect x="45" y="62" width="90" height="34" rx="6" fill="none" stroke="#1f2929" stroke-width="3"/><text x="90" y="112" text-anchor="middle" class="sans teal" font-size="20" font-weight="800">OBD2</text></g><path class="tline" d="M600 870v50"/>
  <path class="line dash" d="M600 1040v85h145" marker-end="url(#arrowDark)"/><g transform="translate(745 1090)"><rect class="card" width="180" height="110" rx="10"/><text x="90" y="54" text-anchor="middle" class="sans ink" font-size="24" font-weight="800">後付け機器</text></g><g transform="translate(845 1008)"><rect class="bad" width="150" height="60" rx="10"/><text x="75" y="38" text-anchor="middle" fill="#fff" font-size="22" font-family="sans-serif" font-weight="800">割り込み</text></g>
  <g transform="translate(930 1120)"><rect x="0" y="0" width="210" height="92" rx="12" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="8 8"/><text x="105" y="38" text-anchor="middle" class="sans ink" font-size="22" font-weight="800">通信エラー</text><text x="105" y="70" text-anchor="middle" class="sans sub" font-size="19">警告灯が点灯</text></g><path class="line dash" d="M925 1145h45" marker-end="url(#arrowDark)"/>
  <g transform="translate(70 1300)"><rect class="box" width="1060" height="120" rx="18"/><circle cx="70" cy="60" r="34" fill="#0abab5"/><text x="70" y="75" text-anchor="middle" fill="#fff" font-size="56" font-family="sans-serif" font-weight="800">!</text><text x="135" y="52" class="sans ink" font-size="24" font-weight="800">CAN通信はリアルタイム性が重要なネットワーク。</text><text x="135" y="88" class="sans ink" font-size="22">不適切な機器の接続や負荷増加が、車両エラーの原因になる可能性がある。</text></g>
</svg>