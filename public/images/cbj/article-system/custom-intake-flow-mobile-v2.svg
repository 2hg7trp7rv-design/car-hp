<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc"><title id="title">吸気系は音だけで選ばない</title><desc id="desc">純正エアボックスとオープンタイプを縦に比較したスマホ用図解</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#fff6ef"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8a6f5d" flood-opacity=".12"/></filter><style>text{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2d2d2d}.t{font-size:40px;font-weight:700}.s{font-size:23px;fill:#76685e}.h{font-size:31px;font-weight:700}.p{font-size:23px;fill:#675e58}.chip{font-size:21px;font-weight:700}</style></defs><rect width="720" height="1420" rx="40" fill="url(#bg)"/><text x="360" y="70" text-anchor="middle" class="t">吸気系は「音」だけで選ばない</text><text x="360" y="108" text-anchor="middle" class="s">流れ・温度・水・復元性を確認する</text>
<g transform="translate(52 150)" filter="url(#sh)"><rect width="616" height="480" rx="34" fill="#fff" stroke="#ffb58d" stroke-width="3"/><rect x="28" y="26" width="180" height="54" rx="27" fill="#fff0e7"/><text x="118" y="62" text-anchor="middle" class="chip" fill="#e8732f">純正エアボックス</text><path d="M72 190h175l38 45h94l38-45h127" stroke="#ff8c42" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M480 190l42-20v40z" fill="#ff8c42"/><rect x="182" y="145" width="164" height="95" rx="20" fill="#fff6ef" stroke="#ffb58d" stroke-width="3"/><circle cx="420" cy="190" r="38" fill="#eef7ff" stroke="#76a9dc" stroke-width="3"/><text x="264" y="182" text-anchor="middle" class="h">エアボックス</text><text x="420" y="198" text-anchor="middle" class="chip" fill="#367dbb">MAF</text><text x="48" y="300" class="h">確認ポイント</text><text x="48" y="350" class="p">・外気導入口と水の分離</text><text x="48" y="392" class="p">・センサー周辺の純正配置</text><text x="48" y="434" class="p">・純正へ戻せる状態を残す</text></g>
<g transform="translate(52 680)" filter="url(#sh)"><rect width="616" height="560" rx="34" fill="#fff" stroke="#f06292" stroke-width="3"/><rect x="28" y="26" width="190" height="54" rx="27" fill="#ffe9f0"/><text x="123" y="62" text-anchor="middle" class="chip" fill="#d84d7c">オープンタイプ</text><path d="M80 185h145" stroke="#f06292" stroke-width="10" stroke-linecap="round"/><path d="M212 185l42-20v40z" fill="#f06292"/><circle cx="312" cy="185" r="66" fill="#fff0f5" stroke="#f06292" stroke-width="4"/><path d="M312 128v114M255 185h114" stroke="#f06292" stroke-width="7"/><circle cx="470" cy="185" r="38" fill="#eef7ff" stroke="#76a9dc" stroke-width="3"/><text x="470" y="193" text-anchor="middle" class="chip" fill="#367dbb">MAF</text><path d="M72 276c95-56 211-56 306 0" stroke="#ff8c42" stroke-width="10" fill="none" stroke-dasharray="14 12"/><text x="48" y="340" class="h">追加で見る場所</text><text x="48" y="390" class="p">・遮熱板とエンジンルーム温度</text><text x="48" y="432" class="p">・雨水対策と配管の密閉</text><text x="48" y="474" class="p">・センサー位置と気流の乱れ</text><text x="48" y="516" class="p">・車種適合と純正復元</text></g>
<g transform="translate(54 1280)"><rect width="188" height="70" rx="35" fill="#fff0e7"/><text x="94" y="45" text-anchor="middle" class="chip" fill="#e8732f">遮熱</text><rect x="212" width="188" height="70" rx="35" fill="#eef7ff"/><text x="306" y="45" text-anchor="middle" class="chip" fill="#367dbb">水対策</text><rect x="424" width="188" height="70" rx="35" fill="#eaf8f6"/><text x="518" y="45" text-anchor="middle" class="chip" fill="#258f84">配管密閉</text></g></svg>