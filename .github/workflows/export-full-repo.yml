name: Export Full Repository

on:
  pull_request:
    branches:
      - "1"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build repository ZIP
        run: |
          zip -r /tmp/car-hp-full.zip . -x '.git/*' '.git/**'

      - name: Upload repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: car-hp-full-repository
          path: /tmp/car-hp-full.zip
          if-no-files-found: error
          retention-days: 1
