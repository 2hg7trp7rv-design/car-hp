<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>カスタムは車全体で判断する</title><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#fff4eb"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#ff6b8a"/><stop offset="1" stop-color="#ff8c42"/></linearGradient><style>text{font-family:sans-serif;fill:#2d2d2d}.t{font-size:52px;font-weight:700}.s{font-size:25px;fill:#76685e}.h{font-size:30px;font-weight:700}.p{font-size:21px;fill:#675e58}.w{fill:white}</style></defs><rect width="1600" height="900" rx="48" fill="url(#b)"/><text x="800" y="92" text-anchor="middle" class="t">カスタムは「車全体」で判断する</text><text x="800" y="136" text-anchor="middle" class="s">部品だけでなく、その後の維持まで一つの流れで見る</text><g stroke-width="4"><rect x="90" y="210" width="390" height="190" rx="30" class="w" stroke="#ffb58d"/><text x="285" y="280" text-anchor="middle" class="h">パーツ選択</text><text x="285" y="325" text-anchor="middle" class="p">目的・適合・取り付け方法</text><text x="285" y="360" text-anchor="middle" class="p">純正へ戻せるか</text><rect x="1120" y="210" width="390" height="190" rx="30" class="w" stroke="#9bd9d2"/><text x="1315" y="280" text-anchor="middle" class="h">車両制御・診断</text><text x="1315" y="325" text-anchor="middle" class="p">センサー・ECU・警告灯</text><text x="1315" y="360" text-anchor="middle" class="p">診断時に説明できるか</text><rect x="90" y="570" width="390" height="190" rx="30" class="w" stroke="#a9cef6"/><text x="285" y="640" text-anchor="middle" class="h">車検・保安基準</text><text x="285" y="685" text-anchor="middle" class="p">地上高・突出・灯火・固定</text><text x="285" y="720" text-anchor="middle" class="p">装着後の実車状態で確認</text><rect x="1120" y="570" width="390" height="190" rx="30" class="w" stroke="#d6b6ea"/><text x="1315" y="640" text-anchor="middle" class="h">整備・保証・売却</text><text x="1315" y="685" text-anchor="middle" class="p">施工履歴・純正部品・書類</text><text x="1315" y="720" text-anchor="middle" class="p">戻し方を説明できるか</text></g><g stroke="#c9b7a8" stroke-width="7" fill="none"><path d="M480 305L590 390"/><path d="M1120 305L1010 390"/><path d="M480 665L590 560"/><path d="M1120 665L1010 560"/></g><rect x="590" y="290" width="420" height="420" rx="52" fill="url(#c)"/><path d="M670 465c18-62 52-100 105-112h50c53 12 87 50 105 112l38 18v55h-56a58 58 0 0 1-112 0h-56a58 58 0 0 1-112 0h-56v-55z" fill="#fff"/><circle cx="700" cy="535" r="25" fill="#2d2d2d"/><circle cx="865" cy="535" r="25" fill="#2d2d2d"/><text x="800" y="625" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">装着後の実車状態</text><text x="800" y="665" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff7f3">付くかではなく、使い続けられるか</text></svg>