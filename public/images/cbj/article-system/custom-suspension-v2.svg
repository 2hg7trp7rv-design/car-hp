<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ローダウン後に確認する項目</title><desc id="desc">車高変更がストローク、アライメント、タイヤ接地、ADAS確認につながることを示す図</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#F8FFF4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#58644C" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#8BC34A"/></marker><style>text{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2D2D2D}.title{font-size:52px;font-weight:700}.sub{font-size:25px;fill:#6E746A}.cardTitle{font-size:30px;font-weight:700}.body{font-size:22px;fill:#62695E}.small{font-size:20px;fill:#6E746A}.step{font-size:22px;font-weight:700;fill:white}</style></defs><rect width="1600" height="900" rx="48" fill="url(#bg)"/><text x="800" y="86" text-anchor="middle" class="title">車高を変えると、見る場所が増える</text><text x="800" y="128" text-anchor="middle" class="sub">低さだけでなく、動ける量・接地・直進性・運転支援の確認へつながる</text><g transform="translate(95 210)" filter="url(#shadow)"><rect width="420" height="470" rx="36" fill="#FFF" stroke="#A8D46F" stroke-width="4"/><path d="M78 265h264c15 0 29 10 34 25l20 58H24l20-58c5-15 19-25 34-25z" fill="#EAF6DA" stroke="#6E9F31" stroke-width="7"/><circle cx="103" cy="360" r="47" fill="#333"/><circle cx="317" cy="360" r="47" fill="#333"/><circle cx="103" cy="360" r="22" fill="#C7E79D"/><circle cx="317" cy="360" r="22" fill="#C7E79D"/><path d="M78 245h264" stroke="#8BC34A" stroke-width="8" stroke-dasharray="16 12"/><path d="M100 165v80M320 165v80" stroke="#8BC34A" stroke-width="8" marker-end="url(#arrow)"/><text x="210" y="80" text-anchor="middle" class="cardTitle">車高変更</text><text x="210" y="125" text-anchor="middle" class="body">装着後の実車状態を確認</text><text x="210" y="435" text-anchor="middle" class="small">最低地上高・干渉・日常での使いやすさ</text></g><path d="M545 445h120" stroke="#8BC34A" stroke-width="9" marker-end="url(#arrow)"/><g transform="translate(680 195)" filter="url(#shadow)"><rect width="380" height="155" rx="30" fill="#FFF" stroke="#FFCA28" stroke-width="4"/><circle cx="65" cy="78" r="36" fill="#FFF6CE"/><path d="M65 42v72M48 59h34M48 97h34" stroke="#D4A000" stroke-width="7" stroke-linecap="round"/><text x="120" y="68" class="cardTitle">ストローク</text><text x="120" y="108" class="body">底付き・跳ね・乗り心地</text></g><g transform="translate(680 375)" filter="url(#shadow)"><rect width="380" height="155" rx="30" fill="#FFF" stroke="#42A5F5" stroke-width="4"/><circle cx="65" cy="78" r="36" fill="#EEF7FF"/><path d="M42 94l23-47 23 47M47 85h36" stroke="#2F82C9" stroke-width="7" fill="none" stroke-linejoin="round"/><text x="120" y="68" class="cardTitle">アライメント</text><text x="120" y="108" class="body">直進性・偏摩耗・操舵感</text></g><g transform="translate(680 555)" filter="url(#shadow)"><rect width="380" height="155" rx="30" fill="#FFF" stroke="#FF8C42" stroke-width="4"/><circle cx="65" cy="78" r="36" fill="#FFF0E7"/><circle cx="65" cy="78" r="23" fill="none" stroke="#E8732F" stroke-width="7"/><path d="M65 55v46M42 78h46" stroke="#E8732F" stroke-width="6"/><text x="120" y="68" class="cardTitle">タイヤ接地</text><text x="120" y="108" class="body">干渉・グリップ・摩耗</text></g><path d="M1090 445h120" stroke="#8BC34A" stroke-width="9" marker-end="url(#arrow)"/><g transform="translate(1220 255)" filter="url(#shadow)"><rect width="285" height="390" rx="36" fill="#FFF" stroke="#AB47BC" stroke-width="4"/><circle cx="142" cy="112" r="64" fill="#F7EEFC"/><path d="M105 125c18-58 56-58 74 0M115 137h54" stroke="#8A39A0" stroke-width="9" fill="none" stroke-linecap="round"/><text x="142" y="225" text-anchor="middle" class="cardTitle">ADAS確認</text><text x="142" y="270" text-anchor="middle" class="body">必要性は一律ではない</text><text x="142" y="312" text-anchor="middle" class="small">車種の整備情報</text><text x="142" y="344" text-anchor="middle" class="small">変更内容・診断結果</text></g><rect x="620" y="785" width="360" height="58" rx="29" fill="#8BC34A"/><text x="800" y="823" text-anchor="middle" class="step">装着後に測る・試す・記録する</text></svg>