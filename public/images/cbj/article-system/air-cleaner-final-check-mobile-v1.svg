<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">初心者が最後に見る5つ</title>
  <desc id="desc">エアクリ選びで初心者が最後に確認する5つの項目。</desc>
  <rect width="720" height="980" rx="42" fill="#FFFFFF"/>
  <rect x="34" y="34" width="652" height="912" rx="34" fill="#F5FFFE" stroke="#BEECE9" stroke-width="3"/>
  <text x="72" y="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="32" font-weight="850" fill="#111827">最後に見る5つ</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <g transform="translate(78 148)"><circle cx="34" cy="34" r="34" fill="#0ABAB5"/><text x="34" y="45" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">1</text><text x="92" y="30" font-size="22" font-weight="850" fill="#111827">自分の車に合うか</text><text x="92" y="62" font-size="16" font-weight="650" fill="#475569">型式・年式・エンジン・適合表</text></g>
    <g transform="translate(78 298)"><circle cx="34" cy="34" r="34" fill="#0ABAB5"/><text x="34" y="45" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">2</text><text x="92" y="30" font-size="22" font-weight="850" fill="#111827">部品がそろっているか</text><text x="92" y="62" font-size="16" font-weight="650" fill="#475569">ステー・ホース・説明書まで</text></g>
    <g transform="translate(78 448)"><circle cx="34" cy="34" r="34" fill="#0ABAB5"/><text x="34" y="45" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">3</text><text x="92" y="30" font-size="22" font-weight="850" fill="#111827">純正に戻せるか</text><text x="92" y="62" font-size="16" font-weight="650" fill="#475569">切り分けにも役立つ</text></g>
    <g transform="translate(78 598)"><circle cx="34" cy="34" r="34" fill="#0ABAB5"/><text x="34" y="45" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">4</text><text x="92" y="30" font-size="22" font-weight="850" fill="#111827">水や熱の位置</text><text x="92" y="62" font-size="16" font-weight="650" fill="#475569">不安すぎる仕様は避ける</text></g>
    <g transform="translate(78 748)"><circle cx="34" cy="34" r="34" fill="#0ABAB5"/><text x="34" y="45" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">5</text><text x="92" y="30" font-size="22" font-weight="850" fill="#111827">管理できそうか</text><text x="92" y="62" font-size="16" font-weight="650" fill="#475569">固定・汚れ・異音をたまに見る</text></g>
  </g>
</svg>
