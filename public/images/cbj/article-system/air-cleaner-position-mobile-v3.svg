<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">エアークリーナーの位置と空気の流れ</title>
  <desc id="desc">外気、エアクリ、MAF、エンジンの順に空気が流れる図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#fffdfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7b4a13" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="8" refY="14" orient="auto"><path d="M2 2 L14 14 L2 14 Z" fill="#4f7ee8"/></marker>
  </defs>
  <rect width="720" height="1080" rx="44" fill="url(#bg)"/>
  <text x="54" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="34" font-weight="850" fill="#242424">エアクリは空気の入口</text>
  <text x="56" y="116" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="18" font-weight="650" fill="#66584d">音だけでなく、空気の流れで見る</text>
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="96" y="176" width="528" height="92" rx="28" fill="#fff" stroke="#42a5f5" stroke-width="4"/>
    <text x="360" y="234" text-anchor="middle" font-size="26" font-weight="850" fill="#174878">外気</text>
    <path d="M360 286 V340" stroke="#4f7ee8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="96" y="362" width="528" height="114" rx="28" fill="#fff" stroke="#ff8c42" stroke-width="4"/>
    <text x="360" y="415" text-anchor="middle" font-size="28" font-weight="850" fill="#7d3c05">エアクリ</text>
    <text x="360" y="448" text-anchor="middle" font-size="17" font-weight="650" fill="#715b47">空気を通し、よごれを止める</text>
    <path d="M360 494 V548" stroke="#4f7ee8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="96" y="570" width="528" height="104" rx="28" fill="#fff" stroke="#26a69a" stroke-width="4"/>
    <text x="360" y="625" text-anchor="middle" font-size="28" font-weight="850" fill="#0a5c52">MAF</text>
    <text x="360" y="656" text-anchor="middle" font-size="17" font-weight="650" fill="#58726e">空気の量を見る場所</text>
    <path d="M360 692 V746" stroke="#4f7ee8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="96" y="768" width="528" height="104" rx="28" fill="#fff" stroke="#ef5350" stroke-width="4"/>
    <text x="360" y="825" text-anchor="middle" font-size="28" font-weight="850" fill="#8d2d2b">エンジン</text>
    <text x="360" y="856" text-anchor="middle" font-size="17" font-weight="650" fill="#76605c">空気と燃料を使う</text>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="70" y="924" width="176" height="84" rx="24" fill="#fff6f8" stroke="#f06292" stroke-width="3"/>
    <text x="158" y="975" text-anchor="middle" font-size="22" font-weight="850" fill="#c53470">音</text>
    <rect x="272" y="924" width="176" height="84" rx="24" fill="#f0fbff" stroke="#42a5f5" stroke-width="3"/>
    <text x="360" y="975" text-anchor="middle" font-size="22" font-weight="850" fill="#1e78b7">熱</text>
    <rect x="474" y="924" width="176" height="84" rx="24" fill="#f3fff9" stroke="#26a69a" stroke-width="3"/>
    <text x="562" y="975" text-anchor="middle" font-size="22" font-weight="850" fill="#168474">水</text>
  </g>
</svg>
