<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1510" viewBox="0 0 720 1510" role="img" aria-labelledby="title desc">
<title id="title">後付け電装品は配線だけの話ではない</title>
<desc id="desc">後付け電装品で確認する5領域を、接続前に順番で確認するスマホ用図解</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f1fbfa"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42a5f5"/><stop offset="1" stop-color="#26a69a"/></linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4d6965" flood-opacity=".14"/></filter>
  <style><![CDATA[
    text{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2d2d2d}
    .t{font-size:41px;font-weight:700}
    .s{font-size:22px;fill:#65726f}
    .h{font-size:29px;font-weight:700}
    .p{font-size:22px;fill:#5d6866}
    .mini{font-size:18px;fill:#65726f}
    .num{font-size:22px;font-weight:700;fill:#fff}
    .white{fill:#fff}
  ]]></style>
</defs>
<rect width="720" height="1510" rx="38" fill="url(#bg)"/>
<text x="360" y="72" text-anchor="middle" class="t">後付け電装品は「配線だけ」ではない</text>
<text x="360" y="110" text-anchor="middle" class="s">適合・電源・信号・診断・純正復元を一つに見る</text>

<g transform="translate(48 152)" filter="url(#cardShadow)">
  <rect width="624" height="214" rx="34" fill="url(#head)"/>
  <rect x="42" y="58" width="132" height="100" rx="24" fill="#fff" opacity=".96"/>
  <path d="M71 90h74M71 114h74M71 138h46" stroke="#42a5f5" stroke-width="8" stroke-linecap="round"/>
  <text x="220" y="86" class="h white">後付け機器</text>
  <text x="220" y="126" class="p white">接続前に確認したいのは</text>
  <text x="220" y="158" class="p white">「適合・電源・信号・診断・純正復元」</text>
  <text x="220" y="186" class="mini white">一つでも曖昧だと、あとで不調や説明不足につながる</text>
</g>

<g stroke="#79b8b1" stroke-width="6" stroke-linecap="round">
  <path d="M360 382v22"/>
  <path d="M360 608v22"/>
  <path d="M360 834v22"/>
  <path d="M360 1060v22"/>
  <path d="M360 1286v22"/>
</g>

<g transform="translate(48 418)" filter="url(#cardShadow)">
  <rect width="624" height="178" rx="28" fill="#fff" stroke="#ff8c42" stroke-width="3"/>
  <circle cx="76" cy="88" r="36" fill="#ff8c42"/><text x="76" y="96" text-anchor="middle" class="num">01</text>
  <text x="136" y="72" class="h">車種適合</text>
  <text x="136" y="114" class="p">型式・年式・装備・仕様</text>
  <text x="136" y="146" class="mini">メーカーの適合情報・注意事項を確認</text>
</g>
<g transform="translate(48 644)" filter="url(#cardShadow)">
  <rect width="624" height="178" rx="28" fill="#fff" stroke="#ffca28" stroke-width="3"/>
  <circle cx="76" cy="88" r="36" fill="#ffca28"/><text x="76" y="96" text-anchor="middle" class="num">02</text>
  <text x="136" y="72" class="h">電源</text>
  <text x="136" y="114" class="p">常時・ACC・低電圧遮断・ヒューズ</text>
  <text x="136" y="146" class="mini">暗電流とバッテリー負荷まで確認</text>
</g>
<g transform="translate(48 870)" filter="url(#cardShadow)">
  <rect width="624" height="178" rx="28" fill="#fff" stroke="#42a5f5" stroke-width="3"/>
  <circle cx="76" cy="88" r="36" fill="#42a5f5"/><text x="76" y="96" text-anchor="middle" class="num">03</text>
  <text x="136" y="72" class="h">車両信号</text>
  <text x="136" y="114" class="p">CAN・速度・リバース・イルミ等</text>
  <text x="136" y="146" class="mini">分岐方法とほかの機器への干渉を確認</text>
</g>
<g transform="translate(48 1096)" filter="url(#cardShadow)">
  <rect width="624" height="178" rx="28" fill="#fff" stroke="#26a69a" stroke-width="3"/>
  <circle cx="76" cy="88" r="36" fill="#26a69a"/><text x="76" y="96" text-anchor="middle" class="num">04</text>
  <text x="136" y="72" class="h">診断</text>
  <text x="136" y="114" class="p">警告灯・DTC・作動確認</text>
  <text x="136" y="146" class="mini">施工前後を比較し、異常がないか見る</text>
</g>
<g transform="translate(48 1322)" filter="url(#cardShadow)">
  <rect width="624" height="150" rx="28" fill="#fff" stroke="#ab47bc" stroke-width="3"/>
  <circle cx="76" cy="75" r="36" fill="#ab47bc"/><text x="76" y="83" text-anchor="middle" class="num">05</text>
  <text x="136" y="68" class="h">純正復元</text>
  <text x="136" y="110" class="p">配線・部品・説明書・施工写真を残す</text>
</g>
<text x="360" y="1498" text-anchor="middle" class="s">※すべての後付け機器がCANへ直接接続されるわけではありません。</text>
</svg>