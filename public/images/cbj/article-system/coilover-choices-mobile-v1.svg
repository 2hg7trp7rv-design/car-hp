<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">純正・ダウンサス・車高調の違い</title><desc id="desc">3つの選択肢をスマホ向けに縦に比較した図</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#F2FAF9"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#315C59" flood-opacity=".12"/></filter><style>text{font-family:"Zen Maru Gothic","Hiragino Sans","Yu Gothic",sans-serif;fill:#202726}.h{font-size:38px;font-weight:700}.sub{font-size:21px;fill:#52605E}.tag{font-size:17px;font-weight:700}.card{font-size:29px;font-weight:700}.body{font-size:21px;fill:#52605E}.label{font-size:19px;font-weight:700;fill:#005E5B}.note{font-size:18px;fill:#52605E}</style></defs>
  <rect width="720" height="1320" rx="38" fill="url(#bg)"/><text x="360" y="58" text-anchor="middle" class="h">変えたいものから選ぶ</text><text x="360" y="94" text-anchor="middle" class="sub">低さ・調整幅・費用・日常性を比べる</text>
  <g transform="translate(45 135)">
    <g filter="url(#s)"><rect width="630" height="330" rx="28" fill="#fff" stroke="#78908C" stroke-width="3"/><rect x="24" y="22" width="90" height="32" rx="16" fill="#E9EFEE"/><text x="69" y="44" text-anchor="middle" class="tag" fill="#3F5D59">基準</text><text x="24" y="98" class="card">純正のまま</text><text x="24" y="140" class="label">向いている目的</text><text x="210" y="140" class="body">日常性とメーカー設計のバランス</text><text x="24" y="188" class="label">主な変化</text><text x="210" y="188" class="body">追加費用や高さの変化なし</text><text x="24" y="236" class="label">確認</text><text x="210" y="236" class="body">純正ショック・ブッシュの劣化</text><text x="24" y="285" class="note">低くしないことも、目的に合えば正しい選択。</text></g>
    <g transform="translate(0 360)" filter="url(#s)"><rect width="630" height="350" rx="28" fill="#fff" stroke="#C49422" stroke-width="3"/><rect x="24" y="22" width="116" height="32" rx="16" fill="#FFF3D3"/><text x="82" y="44" text-anchor="middle" class="tag" fill="#7D5900">変化は限定的</text><text x="24" y="98" class="card">ダウンサス</text><text x="24" y="140" class="label">向いている目的</text><text x="210" y="140" class="body">高さを穏やかに変えたい</text><text x="24" y="188" class="label">主な変化</text><text x="210" y="188" class="body">スプリングを交換する</text><text x="24" y="236" class="label">確認</text><text x="210" y="236" class="body">適合・下がり幅・ストローク</text><text x="210" y="266" class="body">純正ダンパー・アライメント</text><text x="24" y="318" class="note">高さを後から自由に動かす部品ではない。</text></g>
    <g transform="translate(0 740)" filter="url(#s)"><rect width="630" height="370" rx="28" fill="#fff" stroke="#0ABAB5" stroke-width="4"/><rect x="24" y="22" width="116" height="32" rx="16" fill="#DDF5F3"/><text x="82" y="44" text-anchor="middle" class="tag" fill="#005E5B">調整幅が広い</text><text x="24" y="98" class="card">車高調</text><text x="24" y="140" class="label">向いている目的</text><text x="210" y="140" class="body">高さや乗り味を範囲内で調整</text><text x="24" y="188" class="label">主な変化</text><text x="210" y="188" class="body">スプリングとダンパーを交換</text><text x="24" y="236" class="label">確認</text><text x="210" y="236" class="body">構造・推奨範囲・減衰・干渉</text><text x="210" y="266" class="body">アライメント・増し締め・点検</text><text x="24" y="318" class="note">調整できることと、どこでも使えることは別。</text></g>
  </g>
  <text x="360" y="1284" text-anchor="middle" class="note">※変化は車種・製品・タイヤ・設定・取り付け状態で変わります。</text>
</svg>
