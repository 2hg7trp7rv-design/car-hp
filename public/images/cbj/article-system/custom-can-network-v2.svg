<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">後付け電装品で確認する4つの領域</title>
  <desc id="desc">車種適合、電源、車両信号、診断、純正復元の関係図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#F1FBFA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#41635F" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#26A69A"/></marker>
    <style>text{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;fill:#2D2D2D}.title{font-size:52px;font-weight:700}.sub{font-size:25px;fill:#66736F}.cardTitle{font-size:30px;font-weight:700}.body{font-size:22px;fill:#626D69}.center{font-size:34px;font-weight:700;fill:white}.note{font-size:20px;fill:#68746F}</style>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <text x="800" y="86" text-anchor="middle" class="title">後付け電装品は「配線だけ」の話ではない</text>
  <text x="800" y="128" text-anchor="middle" class="sub">車種適合・電源・車両信号・診断・純正復元を一つのセットで確認する</text>

  <g stroke="#26A69A" stroke-width="8" fill="none" marker-end="url(#arrow)" opacity=".9">
    <path d="M430 315C550 330 610 365 680 415"/>
    <path d="M1170 315C1050 330 990 365 920 415"/>
    <path d="M430 650C550 620 610 575 680 525"/>
    <path d="M1170 650C1050 620 990 575 920 525"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="220" width="370" height="190" rx="30" fill="#FFF" stroke="#9BD9D2" stroke-width="4"/>
    <circle cx="175" cy="285" r="38" fill="#E8F5F3"/><path d="M154 285h42M175 264v42" stroke="#26A69A" stroke-width="9" stroke-linecap="round"/>
    <text x="230" y="282" class="cardTitle">車種適合</text><text x="230" y="326" class="body">型式・年式・装備</text><text x="230" y="360" class="body">製品の接続方式</text>

    <rect x="1130" y="220" width="370" height="190" rx="30" fill="#FFF" stroke="#A9CEF6" stroke-width="4"/>
    <circle cx="1205" cy="285" r="38" fill="#EEF7FF"/><path d="M1186 270h38v30h-38zM1197 260v10M1213 260v10M1197 300v10M1213 300v10" stroke="#42A5F5" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="1260" y="282" class="cardTitle">電源・アース</text><text x="1260" y="326" class="body">常時電源・ACC</text><text x="1260" y="360" class="body">ヒューズ・暗電流</text>

    <rect x="100" y="565" width="370" height="190" rx="30" fill="#FFF" stroke="#D6B6EA" stroke-width="4"/>
    <circle cx="175" cy="630" r="38" fill="#F7EEFC"/><path d="M150 630h50M158 615l17 15-17 15M192 615l-17 15 17 15" stroke="#AB47BC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="230" y="627" class="cardTitle">車両信号</text><text x="230" y="671" class="body">CAN・映像・速度信号</text><text x="230" y="705" class="body">介入する範囲を確認</text>

    <rect x="1130" y="565" width="370" height="190" rx="30" fill="#FFF" stroke="#FFB58D" stroke-width="4"/>
    <circle cx="1205" cy="630" r="38" fill="#FFF0E7"/><path d="M1186 612h38v38h-38zM1195 621h20M1195 631h20M1195 641h13" stroke="#FF8C42" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="1260" y="627" class="cardTitle">診断・復元</text><text x="1260" y="671" class="body">警告灯・故障診断</text><text x="1260" y="705" class="body">純正へ戻せる配線</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="300" width="400" height="390" rx="48" fill="#26A69A"/>
    <path d="M690 420h220v80H690z" fill="#FFF" opacity=".95"/><path d="M730 400v20M770 400v20M830 400v20M870 400v20" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="735" cy="540" r="15" fill="#FFF0E7"/><circle cx="800" cy="540" r="15" fill="#EEF7FF"/><circle cx="865" cy="540" r="15" fill="#F7EEFC"/>
    <text x="800" y="645" text-anchor="middle" class="center">後付け電装品</text>
  </g>
  <text x="800" y="820" text-anchor="middle" class="note">※すべての後付け機器がCAN通信へ直接接続されるわけではありません。</text>
</svg>
