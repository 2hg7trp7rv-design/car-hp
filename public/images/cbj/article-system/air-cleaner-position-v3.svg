<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">エアークリーナーの位置と空気の流れ</title>
  <desc id="desc">外気、エアクリ、MAF、エンジンへ空気が流れる様子を示す図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#fffdfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#7b4a13" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M2 2 L14 8 L2 14 Z" fill="#4f7ee8"/></marker>
  </defs>
  <rect width="1280" height="640" rx="48" fill="url(#bg)"/>
  <text x="70" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="38" font-weight="850" fill="#242424">エアクリは、空気の入口</text>
  <text x="72" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20" font-weight="650" fill="#66584d">音の部品ではなく、エンジンに入る空気を通す場所として見る</text>
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="82" y="234" width="196" height="124" rx="32" fill="#fff" stroke="#42a5f5" stroke-width="4"/>
    <text x="180" y="290" text-anchor="middle" font-size="28" font-weight="850" fill="#174878">外気</text>
    <text x="180" y="324" text-anchor="middle" font-size="17" font-weight="650" fill="#65727e">外から入る空気</text>
    <rect x="356" y="216" width="224" height="160" rx="34" fill="#fff" stroke="#ff8c42" stroke-width="5"/>
    <circle cx="468" cy="296" r="48" fill="#fff1df" stroke="#ff8c42" stroke-width="7"/>
    <circle cx="468" cy="296" r="23" fill="#fff" stroke="#ffbd80" stroke-width="5"/>
    <text x="468" y="408" text-anchor="middle" font-size="26" font-weight="850" fill="#7d3c05">エアクリ</text>
    <rect x="658" y="234" width="206" height="124" rx="32" fill="#fff" stroke="#26a69a" stroke-width="4"/>
    <text x="761" y="290" text-anchor="middle" font-size="28" font-weight="850" fill="#0a5c52">MAF</text>
    <text x="761" y="324" text-anchor="middle" font-size="17" font-weight="650" fill="#58726e">空気を読む場所</text>
    <rect x="942" y="234" width="228" height="124" rx="32" fill="#fff" stroke="#ef5350" stroke-width="4"/>
    <text x="1056" y="290" text-anchor="middle" font-size="28" font-weight="850" fill="#8d2d2b">エンジン</text>
    <text x="1056" y="324" text-anchor="middle" font-size="17" font-weight="650" fill="#76605c">空気と燃料を使う</text>
  </g>
  <path d="M292 296 H342" stroke="#4f7ee8" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M596 296 H644" stroke="#4f7ee8" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M880 296 H928" stroke="#4f7ee8" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif">
    <rect x="118" y="468" width="324" height="86" rx="26" fill="#fff6f8" stroke="#f06292" stroke-width="3"/>
    <text x="148" y="506" font-size="22" font-weight="850" fill="#c53470">音</text>
    <text x="198" y="506" font-size="18" font-weight="700" fill="#4f4148">入口の形で聞こえ方が変わる</text>
    <text x="148" y="534" font-size="15" font-weight="650" fill="#71656b">楽しい変化。ただし性能とは分けて見る</text>
    <rect x="478" y="468" width="324" height="86" rx="26" fill="#f0fbff" stroke="#42a5f5" stroke-width="3"/>
    <text x="508" y="506" font-size="22" font-weight="850" fill="#1e78b7">熱</text>
    <text x="558" y="506" font-size="18" font-weight="700" fill="#3e5362">どんな空気を吸うかを見る</text>
    <text x="508" y="534" font-size="15" font-weight="650" fill="#5b6b76">夏や渋滞では印象が変わることもある</text>
    <rect x="838" y="468" width="324" height="86" rx="26" fill="#f3fff9" stroke="#26a69a" stroke-width="3"/>
    <text x="868" y="506" font-size="22" font-weight="850" fill="#168474">水</text>
    <text x="918" y="506" font-size="18" font-weight="700" fill="#3b584e">雨・洗車・固定も見る</text>
    <text x="868" y="534" font-size="15" font-weight="650" fill="#5b716a">楽しむための確認ポイント</text>
  </g>
</svg>
