<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 733" role="img" aria-label="足回りカスタムの車高・ストローク・アライメントの関係図"><rect width="1100" height="733" rx="44" fill="#F5F1EB"/><text x="96" y="94" font-family="Arial,'Noto Sans JP',sans-serif" font-size="30" font-weight="700" fill="#2D2D2D">SUSPENSION / GEOMETRY</text><text x="96" y="136" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" fill="#8B8278">車高だけでなく接地・ストローク・安全装置まで見る</text><g transform="translate(150 210)"><path d="M70 190h760" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/><path d="M160 75Q445 0 735 75l-42 74H203z" fill="#fff" stroke="#2D2D2D" stroke-width="5"/><circle cx="250" cy="190" r="72" fill="#2D2D2D"/><circle cx="250" cy="190" r="34" fill="#F5F1EB"/><circle cx="650" cy="190" r="72" fill="#2D2D2D"/><circle cx="650" cy="190" r="34" fill="#F5F1EB"/><path d="M250 96v58M650 96v58" stroke="#A5D8D3" stroke-width="12" stroke-linecap="round"/><path d="M206 285h88M606 285h88" stroke="#E97451" stroke-width="7" stroke-linecap="round"/><text x="250" y="330" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#2D2D2D">ALIGNMENT</text><text x="650" y="330" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#2D2D2D">STROKE</text></g><text x="125" y="575" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" fill="#6B6B6B">低さだけで決めると、接地・干渉・ADAS補正に影響する</text><text x="125" y="615" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" fill="#6B6B6B">調整後はアライメント測定とストローク確認をセットにする</text></svg>