<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">サスペンションのストローク断面図</title><desc id="desc">ノーマル車高とローダウン時のストローク量、バンプストップまでの余裕を比較する図解。</desc>
  <defs><style>.bg{fill:#f7f1e7}.ink{fill:#1f2929}.sub{fill:#6f6960}.teal{fill:#0abab5}.line{stroke:#1f2929;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.tline{stroke:#0abab5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gline{stroke:#555;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fffaf0;stroke:#0abab5;stroke-width:3}.box{fill:#fffdf8;stroke:#d9d1bf;stroke-width:3}.jp{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif}.sans{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#0abab5"/></marker><marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10z" fill="#555"/></marker></defs>
  <rect class="bg" width="1200" height="1500"/><text x="600" y="115" text-anchor="middle" class="jp ink" font-size="64" font-weight="800">サスペンションのストローク断面図</text><text x="600" y="170" text-anchor="middle" class="sans sub" font-size="26" letter-spacing="1.5">Suspension stroke section</text><path class="tline" d="M260 205h680"/><rect x="584" y="189" width="32" height="32" transform="rotate(45 600 205)" fill="none" stroke="#0abab5" stroke-width="4"/>
  <g transform="translate(70 250)"><rect class="box" width="320" height="125" rx="16"/><text x="160" y="58" text-anchor="middle" class="sans teal" font-size="34" font-weight="800">ノーマル</text><text x="160" y="96" text-anchor="middle" class="sans ink" font-size="23">ストローク量に余裕がある</text></g><g transform="translate(440 250)"><rect class="box" width="320" height="125" rx="16"/><text x="160" y="58" text-anchor="middle" class="sans teal" font-size="34" font-weight="800">ローダウン</text><text x="160" y="96" text-anchor="middle" class="sans ink" font-size="23">ストロークが短くなる</text></g><g transform="translate(810 250)"><rect class="box" width="320" height="125" rx="16"/><text x="160" y="58" text-anchor="middle" class="sans teal" font-size="34" font-weight="800">当たりやすい</text><text x="160" y="96" text-anchor="middle" class="sans ink" font-size="23">バンプストップへ近づく</text></g>
  <g transform="translate(70 430)"><rect class="panel" width="500" height="620" rx="18"/><rect x="155" y="0" width="190" height="66" rx="14" fill="#0abab5"/><text x="250" y="43" text-anchor="middle" fill="#fff" font-size="31" font-family="sans-serif" font-weight="800">ノーマル</text><path class="line" d="M250 100v420M215 120h70M225 150h50M220 180h60M215 210h70M220 240h60M215 270h70M220 300h60"/><path class="line" d="M190 320c45-40 75-40 120 0M190 360c45-40 75-40 120 0M190 400c45-40 75-40 120 0"/><rect x="220" y="88" width="60" height="32" rx="10" fill="none" stroke="#1f2929" stroke-width="3"/><rect x="228" y="120" width="44" height="40" rx="8" fill="none" stroke="#1f2929" stroke-width="3"/><circle cx="250" cy="535" r="20" fill="none" stroke="#0abab5" stroke-width="5"/><path class="line" d="M250 535h95l75 50"/><ellipse cx="360" cy="500" rx="78" ry="145" fill="none" stroke="#9aa" stroke-width="3" opacity=".55"/><path class="tline" d="M420 120v395" marker-end="url(#arrow)"/><path class="tline" d="M420 515v-395" marker-end="url(#arrow)"/><text x="456" y="325" class="sans teal" font-size="30" font-weight="800" writing-mode="tb">ストローク量</text><text x="35" y="145" class="sans ink" font-size="22">バンプストップ</text><path class="tline" d="M165 145h58"/><text x="35" y="250" class="sans ink" font-size="22">スプリング</text><path class="tline" d="M150 245h58"/><text x="35" y="470" class="sans ink" font-size="22">ダンパー</text><path class="tline" d="M135 465h82"/></g>
  <g transform="translate(630 430)"><rect class="panel" width="500" height="620" rx="18"/><rect x="155" y="0" width="190" height="66" rx="14" fill="#333"/><text x="250" y="43" text-anchor="middle" fill="#fff" font-size="31" font-family="sans-serif" font-weight="800">ローダウン</text><path class="line" d="M250 155v360M215 170h70M225 198h50M220 226h60M215 254h70M220 282h60"/><path class="line" d="M190 340c45-35 75-35 120 0M190 372c45-35 75-35 120 0"/><rect x="220" y="115" width="60" height="32" rx="10" fill="none" stroke="#1f2929" stroke-width="3"/><rect x="228" y="148" width="44" height="36" rx="8" fill="none" stroke="#1f2929" stroke-width="3"/><circle cx="250" cy="535" r="20" fill="none" stroke="#444" stroke-width="5"/><path class="line" d="M250 535h95l75 50"/><ellipse cx="360" cy="500" rx="78" ry="145" fill="none" stroke="#9aa" stroke-width="3" opacity=".55"/><path class="gline" d="M420 260v185" marker-end="url(#arrowGray)"/><path class="gline" d="M420 445v-185" marker-end="url(#arrowGray)"/><text x="456" y="335" class="sans ink" font-size="30" font-weight="800" writing-mode="tb">ストローク量</text><rect x="312" y="128" width="150" height="65" rx="12" fill="#fffdf8" stroke="#333" stroke-width="3"/><circle cx="340" cy="160" r="20" fill="#333"/><text x="340" y="174" text-anchor="middle" fill="#fff" font-size="34" font-family="sans-serif" font-weight="800">×</text><text x="366" y="155" class="sans ink" font-size="18" font-weight="800">当たり</text><text x="366" y="180" class="sans ink" font-size="18" font-weight="800">やすい</text><text x="35" y="145" class="sans ink" font-size="22">バンプストップ</text><path class="gline" d="M165 145h60"/><text x="35" y="250" class="sans ink" font-size="22">スプリング</text><path class="gline" d="M150 245h58"/><text x="35" y="470" class="sans ink" font-size="22">ダンパー</text><path class="gline" d="M135 465h82"/></g>
  <g transform="translate(70 1110)"><rect class="box" width="470" height="105" rx="14"/><circle cx="60" cy="53" r="32" fill="none" stroke="#0abab5" stroke-width="8"/><text x="120" y="48" class="sans teal" font-size="30" font-weight="800">ノーマル：余裕あり</text><text x="120" y="83" class="sans ink" font-size="21">十分なストローク量を確保できる</text></g><text x="600" y="1175" text-anchor="middle" class="sans teal" font-size="28" font-weight="800">比較</text><g transform="translate(660 1110)"><rect class="box" width="470" height="105" rx="14" stroke="#333"/><circle cx="60" cy="53" r="32" fill="#333"/><text x="60" y="66" text-anchor="middle" fill="#fff" font-size="44" font-family="sans-serif" font-weight="800">×</text><text x="120" y="48" class="sans ink" font-size="30" font-weight="800">ローダウン：余裕が少ない</text><text x="120" y="83" class="sans ink" font-size="21">バンプストップに近い</text></g>
  <rect x="70" y="1285" width="1060" height="86" rx="14" fill="none" stroke="#0abab5" stroke-width="3" stroke-dasharray="8 8"/><circle cx="130" cy="1328" r="27" fill="#0abab5"/><text x="130" y="1340" text-anchor="middle" fill="#fff" font-size="42" font-family="sans-serif" font-weight="800">!</text><text x="185" y="1338" class="sans ink" font-size="24">車高を下げるとストローク量が減り、段差で当たりやすくなる。</text>
</svg>