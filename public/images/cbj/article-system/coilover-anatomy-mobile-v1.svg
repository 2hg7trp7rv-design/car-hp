<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
  <title id="title">車高調の基本構成</title><desc id="desc">車高調の4つの構成要素をスマホ向けに縦に整理した図</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#EDFAF8"/></linearGradient><linearGradient id="d" x2="0" y2="1"><stop stop-color="#0ABAB5"/><stop offset="1" stop-color="#006E6B"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#315C59" flood-opacity=".14"/></filter><style>text{font-family:"Zen Maru Gothic","Hiragino Sans","Yu Gothic",sans-serif;fill:#202726}.h{font-size:38px;font-weight:700}.sub{font-size:21px;fill:#52605E}.card{font-size:27px;font-weight:700}.body{font-size:21px;fill:#52605E}.num{font-size:18px;font-weight:700;fill:#fff}.note{font-size:21px;font-weight:700;fill:#005E5B}</style></defs>
  <rect width="720" height="1180" rx="38" fill="url(#bg)"/><text x="360" y="58" text-anchor="middle" class="h">車高調は、4つを一緒に見る</text><text x="360" y="94" text-anchor="middle" class="sub">高さだけでなく、支える・動く・収める部品</text>
  <g transform="translate(244 125) scale(.72)" filter="url(#s)"><rect x="44" y="0" width="160" height="30" rx="15" fill="#fff" stroke="#005E5B" stroke-width="6"/><rect x="108" y="28" width="32" height="56" rx="14" fill="#D6F2F0" stroke="#005E5B" stroke-width="6"/><rect x="90" y="72" width="68" height="300" rx="28" fill="url(#d)" stroke="#004F4D" stroke-width="7"/><path d="M46 98h156M46 143h156M46 188h156M46 233h156M46 278h156" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M50 98L22 120l28 23-28 22 28 23-28 22 28 23-28 22 28 23M198 98l28 22-28 23 28 22-28 23 28 22-28 23 28 22-28 23" fill="none" stroke="#0ABAB5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="296" width="176" height="23" rx="12" fill="#D09A21" stroke="#7D5900" stroke-width="5"/><rect x="36" y="328" width="176" height="23" rx="12" fill="#F4C65B" stroke="#7D5900" stroke-width="5"/><rect x="98" y="368" width="52" height="82" rx="17" fill="#fff" stroke="#005E5B" stroke-width="7"/></g>
  <g transform="translate(44 500)">
    <g filter="url(#s)"><rect width="632" height="130" rx="25" fill="#fff" stroke="#0ABAB5" stroke-width="3"/><circle cx="55" cy="52" r="27" fill="#006E6B"/><text x="55" y="59" text-anchor="middle" class="num">01</text><text x="99" y="45" class="card">スプリング</text><text x="99" y="78" class="body">車体を支え、縮んだあとに戻ろうとする。</text><text x="99" y="108" class="body">硬さだけで乗り心地は決まらない。</text></g>
    <g transform="translate(0 148)" filter="url(#s)"><rect width="632" height="130" rx="25" fill="#fff" stroke="#0ABAB5" stroke-width="3"/><circle cx="55" cy="52" r="27" fill="#006E6B"/><text x="55" y="59" text-anchor="middle" class="num">02</text><text x="99" y="45" class="card">ダンパー</text><text x="99" y="78" class="body">揺れを収める。減衰力調整は便利だが、</text><text x="99" y="108" class="body">乗り心地を自由に作る魔法のつまみではない。</text></g>
    <g transform="translate(0 296)" filter="url(#s)"><rect width="632" height="130" rx="25" fill="#fff" stroke="#C49422" stroke-width="3"/><circle cx="55" cy="52" r="27" fill="#9A6C00"/><text x="55" y="59" text-anchor="middle" class="num">03</text><text x="99" y="45" class="card">車高・スプリング調整部</text><text x="99" y="78" class="body">構造で調整方法が違う。車高とプリロードを</text><text x="99" y="108" class="body">同じものとして動かさない。</text></g>
    <g transform="translate(0 444)" filter="url(#s)"><rect width="632" height="130" rx="25" fill="#fff" stroke="#55706D" stroke-width="3"/><circle cx="55" cy="52" r="27" fill="#3F5D59"/><text x="55" y="59" text-anchor="middle" class="num">04</text><text x="99" y="45" class="card">取り付け部・周辺部品</text><text x="99" y="78" class="body">アッパーマウント、ブッシュ、リンク、</text><text x="99" y="108" class="body">タイヤとの組み合わせまで確認する。</text></g>
  </g>
  <rect x="70" y="1100" width="580" height="56" rx="28" fill="#DDF5F3"/><text x="360" y="1136" text-anchor="middle" class="note">低さだけではなく、車を動かす部品として選ぶ。</text>
</svg>
